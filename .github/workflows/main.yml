name: Build AksharAlly APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: aksharally/aksharally_ui

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter 3.38.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: stable
          cache: true

      - name: Verify toolchain
        run: |
          java -version
          flutter --version
          flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Check Android compatibility
        run: flutter analyze --suggestions

      - name: Build APK
        run: flutter build apk --release --verbose

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AksharAlly-release-apk
          path: aksharally/aksharally_ui/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Upload build logs if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Android-build-logs
          path: |
            aksharally/aksharally_ui/android
          retention-days: 7
